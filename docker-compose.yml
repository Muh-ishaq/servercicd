services:
  server:
    image: ${DOCKERHUB_USERNAME:-ishaq0925}/${IMAGE_NAME:-lastpassword}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
