name: Build, publish, and deploy website

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: ishaq0925
  IMAGE_NAME: lastpassword

concurrency:
  group: image-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate website and calculate next image version
        id: version
        shell: bash
        run: |
          test -s index.html
          baseline="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$baseline" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a numeric major.minor baseline" >&2
            exit 1
          fi

          latest_tag="$(git tag --list | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          current="$baseline"
          if [[ -n "$latest_tag" ]] && [[ "$(printf '%s\n' "$baseline" "$latest_tag" | sort -V | tail -n 1)" == "$latest_tag" ]]; then
            current="$latest_tag"
          fi

          major="${current%%.*}"
          minor="${current#*.}"
          version="${major}.$((minor + 1))"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}

      - name: Record published image version
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$IMAGE_VERSION" -m "Publish Docker image $IMAGE_VERSION"
          git push origin "refs/tags/$IMAGE_VERSION"

  deploy:
    needs: publish
    runs-on: [self-hosted, windows, x64]
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Pull and replace local website container
        env:
          DOCKERHUB_USERNAME: ishaq0925
          IMAGE_NAME: lastpassword
          IMAGE_TAG: ${{ needs.publish.outputs.image_version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          docker compose pull
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not pull the published website image.'
          }

          $existing = docker ps -aq --filter "name=^mot$"
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not inspect the existing mot container.'
          }
          if ($existing) {
            docker rm --force mot
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not replace the existing mot container.'
            }
          }

          docker compose up --detach --no-build --force-recreate --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not start the new website container.'
          }

          $containerId = docker compose ps --quiet website
          if (-not $containerId) {
            throw 'The website container was not created.'
          }

          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $health = docker inspect --format='{{.State.Health.Status}}' $containerId
            if ($health -eq 'healthy') {
              Write-Host "Website is healthy at http://localhost:3000 using image version $env:IMAGE_TAG."
              exit 0
            }
            if ($health -eq 'unhealthy') {
              docker compose logs --no-color website
              throw 'The new website container failed its health check.'
            }
            Start-Sleep -Seconds 2
          }

          docker compose logs --no-color website
          throw 'Timed out waiting for the website health check.'

  notify:
    name: Email deployment result
    if: always()
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment email
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DEPLOYMENT_NOTIFICATION_EMAIL: ${{ secrets.DEPLOYMENT_NOTIFICATION_EMAIL }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE_VERSION: ${{ needs.publish.outputs.image_version }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import ssl
          import sys
          from email.message import EmailMessage

          required = (
              "MAIL_SERVER",
              "MAIL_PORT",
              "MAIL_USERNAME",
              "MAIL_PASSWORD",
              "DEPLOYMENT_NOTIFICATION_EMAIL",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(
                  "::warning::Email notification skipped; configure repository "
                  f"Actions secrets: {', '.join(missing)}"
              )
              sys.exit(0)

          publish_result = os.environ["PUBLISH_RESULT"]
          deploy_result = os.environ["DEPLOY_RESULT"]
          success = publish_result == "success" and deploy_result == "success"
          status = "SUCCEEDED" if success else "FAILED"
          version = os.environ.get("IMAGE_VERSION") or "not published"

          message = EmailMessage()
          message["Subject"] = f"[servercicd] Deployment {status} ({version})"
          message["From"] = os.environ["MAIL_USERNAME"]
          message["To"] = os.environ["DEPLOYMENT_NOTIFICATION_EMAIL"]
          message.set_content(
              f"Deployment {status.lower()}.\n\n"
              f"Branch: {os.environ['BRANCH_NAME']}\n"
              f"Image version: {version}\n"
              f"Publish job: {publish_result}\n"
              f"Deploy job: {deploy_result}\n\n"
              f"Workflow run: {os.environ['RUN_URL']}\n"
          )

          with smtplib.SMTP(
              os.environ["MAIL_SERVER"],
              int(os.environ["MAIL_PORT"]),
              timeout=30,
          ) as server:
              server.starttls(context=ssl.create_default_context())
              server.login(
                  os.environ["MAIL_USERNAME"],
                  os.environ["MAIL_PASSWORD"],
              )
              server.send_message(message)
          print("Deployment email sent.")
          PY
