name: Build and deploy server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test server
        run: npm test

      - name: Validate Docker Hub configuration
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set repository variable DOCKERHUB_USERNAME"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set repository secret DOCKERHUB_TOKEN"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ github.event_name == 'pull_request' && 'server:test' || format('{0}/server:{1}', vars.DOCKERHUB_USERNAME, github.sha) }}
            ${{ github.event_name == 'pull_request' && 'server:pr' || format('{0}/server:latest', vars.DOCKERHUB_USERNAME) }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: [self-hosted, linux, server-vm]
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Update Compose image tag and deploy
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          printf 'DOCKERHUB_USERNAME=%s\nIMAGE_NAME=server\nIMAGE_TAG=%s\n' "$DOCKERHUB_USERNAME" "$IMAGE_TAG" > .env
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          printf '{"text":"Server deployment %s for %s at %s"}' \
            "${{ job.status }}" "$GITHUB_REPOSITORY" "$GITHUB_SHA" |
            curl --fail --silent --show-error \
              -H 'Content-type: application/json' \
              --data-binary @- "$SLACK_WEBHOOK_URL"
